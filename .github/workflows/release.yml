name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create release for'
        required: true
        default: 'v0.1.0'

env:
  CARGO_TERM_COLOR: always

jobs:
  version-check:
    name: Version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check versions agree
        uses: ./.github/actions/version-check
        with:
          expected_tag: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

  build:
    name: Build for ${{ matrix.target }}
    needs: version-check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # This target/os/lib_name mapping is one of four places that encode
      # supported platforms — the others are PLATFORM_MAPPINGS in
      # lua/time-tracking-nvim/init.lua, the case in build.sh, and the
      # supported-platforms hint in lua/time-tracking-nvim/health.lua. A new
      # target added here must be added to all three.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            lib_name: libtime_tracking_nvim.so
          - target: x86_64-apple-darwin
            os: macos-latest
            lib_name: libtime_tracking_nvim.dylib
          - target: aarch64-apple-darwin
            os: macos-latest
            lib_name: libtime_tracking_nvim.dylib
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            lib_name: time_tracking_nvim.dll

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable @ 2026-09-03
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create plugin structure
        shell: bash
        run: |
          mkdir -p plugin-structure/target/release

          # Neovim requires the library without the `lib` prefix; the matrix
          # carries only the built name, and this strips it.
          nvim_name="$(basename '${{ matrix.lib_name }}' | sed 's/^lib//')"

          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} "plugin-structure/target/release/${nvim_name}"

      - name: Copy plugin files
        shell: bash
        run: |
          # Copy lua files
          if [ -d "lua" ]; then
            cp -r lua plugin-structure/
          fi
          
          # Copy plugin files
          if [ -d "plugin" ]; then
            cp -r plugin plugin-structure/
          fi
          
          # Copy documentation and metadata
          if [ -f "README.md" ]; then
            cp README.md plugin-structure/
          fi
          
          if [ -f "LICENSE" ]; then
            cp LICENSE plugin-structure/
          fi

      - name: Package plugin
        shell: bash
        run: |
          cd plugin-structure
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a ../time-tracking-nvim-${{ matrix.target }}.zip .
          else
            tar -czf ../time-tracking-nvim-${{ matrix.target }}.tar.gz .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: time-tracking-nvim-${{ matrix.target }}
          path: |
            time-tracking-nvim-${{ matrix.target }}.*
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Get tag name
        id: get_tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -o -name "*.zip" | while read file; do
            cp "$file" release-assets/
          done
          cd release-assets
          # Names only, no paths: the Lua verifier matches on basename.
          sha256sum *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS
          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: Release ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## Time Tracking Neovim Plugin ${{ steps.get_tag.outputs.tag }}
            
            ### Installation
            
            #### Using lazy.nvim
            ```lua
            {
              "stevenwcarter/time-tracking-nvim",
              tag = "${{ steps.get_tag.outputs.tag }}",
              config = function()
                require("time-tracking-nvim").setup()
              end,
            }
            ```
            
            ### Downloads
            
            Choose the appropriate binary for your platform:
            - **Linux x86_64**: `time-tracking-nvim-x86_64-unknown-linux-gnu.tar.gz`
            - **macOS Intel**: `time-tracking-nvim-x86_64-apple-darwin.tar.gz`  
            - **macOS Apple Silicon**: `time-tracking-nvim-aarch64-apple-darwin.tar.gz`
            - **Windows**: `time-tracking-nvim-x86_64-pc-windows-msvc.zip`
            
            ### Changes
            
            - Built with Rust for optimal performance
            - Live preview updates as you edit markdown files
            - Automatic window management
            - Cross-platform support
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}